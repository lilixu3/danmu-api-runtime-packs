name: 发布 Android 公共运行时依赖

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新校验、签名并发布当前锁定依赖"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish-runtime-pack.yml"

permissions:
  contents: write

concurrency:
  group: runtime-dependencies-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      serial: ${{ steps.state.outputs.serial }}
    steps:
      - name: 检出依赖仓库（不保留写入凭据）
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 配置 Node.js 18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.4
          check-latest: false

      - name: 运行构建器测试
        run: python3 -m unittest discover -s tests -v

      - name: 检出稳定版和开发版核心
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/huangxd-/danmu_api.git "$RUNNER_TEMP/stable-core"
          git clone --depth 1 --branch main https://github.com/lilixu3/danmu_api.git "$RUNNER_TEMP/dev-core"

      - name: 校验公共依赖是否覆盖两个核心
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_runtime_pack.py \
            --runtime-dir runtime \
            --stable-core-dir "$RUNNER_TEMP/stable-core" \
            --dev-core-dir "$RUNNER_TEMP/dev-core" \
            --validate-only

      - name: 判断构建定义或核心提交是否变化
        id: state
        env:
          FORCE_PUBLISH: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum runtime/package-lock.json | awk '{print $1}')"
          policy_sha="$(sha256sum runtime/android-runtime-policy.json | awk '{print $1}')"
          builder_sha="$(python3 -c 'from scripts.build_runtime_pack import build_definition_sha256; print(build_definition_sha256())')"
          stable_commit="$(git -C "$RUNNER_TEMP/stable-core" rev-parse HEAD)"
          dev_commit="$(git -C "$RUNNER_TEMP/dev-core" rev-parse HEAD)"
          previous_serial=0
          current_lock=""
          current_policy=""
          current_builder=""
          current_stable_commit=""
          current_dev_commit=""
          if [[ -f manifest.json ]]; then
            previous_serial="$(jq -r '.serial // 0' manifest.json)"
            current_lock="$(jq -r '.runtimeLockSha256 // ""' manifest.json)"
            current_policy="$(jq -r '.runtimePolicySha256 // ""' manifest.json)"
            current_builder="$(jq -r '.buildDefinitionSha256 // ""' manifest.json)"
            current_stable_commit="$(jq -r '.coreCommits.stable // ""' manifest.json)"
            current_dev_commit="$(jq -r '.coreCommits.dev // ""' manifest.json)"
          fi
          if [[ "$FORCE_PUBLISH" != "true" &&
                "$current_lock" == "$lock_sha" &&
                "$current_policy" == "$policy_sha" &&
                "$current_builder" == "$builder_sha" &&
                "$current_stable_commit" == "$stable_commit" &&
                "$current_dev_commit" == "$dev_commit" ]]; then
            publish=false
          else
            publish=true
          fi
          {
            echo "publish=$publish"
            echo "serial=$((previous_serial + 1))"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并启动测试 node_modules.zip
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 scripts/build_runtime_pack.py \
            --runtime-dir runtime \
            --stable-core-dir "$RUNNER_TEMP/stable-core" \
            --dev-core-dir "$RUNNER_TEMP/dev-core" \
            --output-dir dist \
            --serial "${{ steps.state.outputs.serial }}" \
            --repository "$GITHUB_REPOSITORY" \
            --node-major 18
          test -f dist/node_modules.zip
          jq -e --slurpfile policy runtime/android-runtime-policy.json \
            '(.schema == 3) and (.runtimeProtocol == 2) and (.nodeMajor == 18) and
             (.coreVersions.stable | test("^[0-9]+(\\.[0-9]+)+")) and
             (.coreVersions.dev | test("^[0-9]+(\\.[0-9]+)+")) and
             (.coreCommits.stable | test("^[0-9a-f]{40}$")) and
             (.coreCommits.dev | test("^[0-9a-f]{40}$")) and
             (.runtimePolicySha256 | test("^[0-9a-f]{64}$")) and
             (.buildDefinitionSha256 | test("^[0-9a-f]{64}$")) and
             (.artifactUrl | endswith("/node_modules.zip")) and
             (.artifactSha256 | test("^[0-9a-f]{64}$")) and
             (.artifactSize > 0 and .artifactSize <= $policy[0].budgets.maxArchiveBytes) and
             (.artifactFileCount > 0 and .artifactFileCount <= $policy[0].budgets.maxFileCount) and
             (.artifactExtractedSize > 0 and .artifactExtractedSize <= $policy[0].budgets.maxExtractedBytes) and
             (.packages | length == ($policy[0].approvedPackages | length)) and
             (.excludedPackages | sort ==
               ([$policy[0].excludedPackages | keys[] | sub("^node_modules/"; "")] | sort))' \
            dist/manifest.json >/dev/null

      - name: 上传已校验的构建结果
        if: steps.state.outputs.publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-runtime-dependencies
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布与签名
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 检出目标分支
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: 下载已校验的构建结果
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: shared-runtime-dependencies
          path: dist

      - name: 发布不可变的 node_modules.zip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive_sha="$(jq -r '.artifactSha256' dist/manifest.json)"
          stable_version="$(jq -r '.coreVersions.stable' dist/manifest.json)"
          dev_version="$(jq -r '.coreVersions.dev' dist/manifest.json)"
          tag="runtime-dependencies-${archive_sha:0:12}"
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/node_modules.zip"
          test "$(jq -r '.artifactUrl' dist/manifest.json)" = "$expected_url"
          test "$(sha256sum dist/node_modules.zip | awk '{print $1}')" = "$archive_sha"
          if [[ "$stable_version" == "$dev_version" ]]; then
            release_title="$stable_version"
            release_notes="适用于稳定版和开发版核心 $stable_version 的 Android 运行时依赖。"
          else
            release_title="稳定版 $stable_version / 开发版 $dev_version"
            release_notes="适用于稳定版核心 $stable_version 和开发版核心 $dev_version 的 Android 运行时依赖。"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern node_modules.zip \
              --dir "$existing_dir"
            cmp --silent dist/node_modules.zip "$existing_dir/node_modules.zip"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes"
          else
            gh release create "$tag" dist/node_modules.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes"
          fi

      - name: 签名清单原始字节
        env:
          RUNTIME_PACK_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_PACK_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_PACK_SIGNING_PRIVATE_KEY"
          key="$RUNNER_TEMP/runtime-pack-signing-key.pem"
          signature="$RUNNER_TEMP/manifest.sig.bin"
          umask 077
          printf '%s\n' "$RUNTIME_PACK_SIGNING_PRIVATE_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out "$signature" dist/manifest.json
          base64 -w0 "$signature" > dist/manifest.sig
          openssl dgst -sha256 -verify runtime-pack-public-key.pem \
            -signature "$signature" dist/manifest.json
          rm -f "$key" "$signature"

      - name: 提交当前签名清单
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp dist/manifest.json manifest.json
          cp dist/manifest.sig manifest.sig
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest.sig
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "签名清单无变化，无需提交。"
            exit 0
          fi
          stable_version="$(jq -r '.coreVersions.stable' manifest.json)"
          dev_version="$(jq -r '.coreVersions.dev' manifest.json)"
          if [[ "$stable_version" == "$dev_version" ]]; then
            version_label="$stable_version"
          else
            version_label="$stable_version / $dev_version"
          fi
          git commit -m "发布运行时依赖 $version_label"
          git push origin "HEAD:$TARGET_BRANCH"
